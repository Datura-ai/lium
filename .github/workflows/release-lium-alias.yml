name: Publish lium Alias Stub

on:
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build and publish lium alias stub
    runs-on: ubuntu-latest
    # same gate as release.yml's publish job: PyPI's (pending) trusted publisher names this file and the `pypi`
    # environment; its required reviewer approves the run (RELEASING.md "Who can publish")
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install build dependencies
      run: pip install build

    - name: Build stub package
      working-directory: stubs/lium
      run: python -m build --sdist --wheel --outdir dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        attestations: true
        packages-dir: stubs/lium/dist/
        verbose: true
        print-hash: true
