name: Publish lium Alias Stub

on:
  workflow_dispatch:

jobs:
  # Holds no upload credential: build dependencies and the build backend come from PyPI and run here, never in the
  # job that can mint a PyPI token.
  build:
    name: Build lium alias stub
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.10'

    - name: Install build dependencies
      run: pip install build twine

    - name: Build stub package
      working-directory: stubs/lium
      run: python -m build --sdist --wheel --outdir dist/

    - name: Check the distributions' metadata
      run: twine check --strict stubs/lium/dist/*

    - name: Upload stub distributions
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: lium-stub-dist
        path: stubs/lium/dist/
        if-no-files-found: error

  # PyPI's (pending) trusted publisher names this file and the `pypi` environment, which admits only `main`; a required
  # reviewer other than the loop's account approves the run (RELEASING.md "Who can publish").
  # The approval gates the upload only; the `if` keeps a dispatch from any other ref to a build.
  publish:
    name: Publish lium alias stub
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/lium/
    permissions:
      actions: read     # the environment read below
      id-token: write

    steps:
    # Checked before the upload: at least one required reviewer; not the loop's account (any one listed reviewer can
    # approve); users only (this job's token cannot read team membership); can_admins_bypass false (a missing field
    # counts as true). prevent_self_review is not required: a maintainer may approve a release they started (DAH-4384).
    # It cannot prove pypi.org's side (.github/rulesets/README.md section 2).
    - name: Environment pypi must require a reviewer other than the loop's account
      env:
        GH_TOKEN: ${{ github.token }}
        LOOP_ACCOUNT_ID: '114649324'
      run: |
        fail() {
          echo "environment pypi: $1" >&2
          echo "nothing published (.github/rulesets/README.md section 1)" >&2
          exit 1
        }
        [[ "$LOOP_ACCOUNT_ID" =~ ^[0-9]+$ ]] || fail "LOOP_ACCOUNT_ID is not a user id; this step cannot rule out the loop's account"
        env_json="$(gh api "repos/$GITHUB_REPOSITORY/environments/pypi")" || fail "could not be read"
        rule="$(jq -c '[.protection_rules[]? | select(.type == "required_reviewers")] | first // {}' <<<"$env_json")" ||
          fail "could not be parsed"
        echo "required reviewers on environment pypi: $(jq -r '[.reviewers[]? | "\(.type) \(.reviewer.login // .reviewer.slug) (id \(.reviewer.id))"] | join(", ") | if . == "" then "none" else . end' <<<"$rule")"
        echo "can_admins_bypass on environment pypi: $(jq -r '.can_admins_bypass | tostring' <<<"$env_json")"
        jq -e '(.reviewers // []) | length > 0' <<<"$rule" >/dev/null ||
          fail "no required reviewer; an admin adds at least one human"
        jq -e --argjson loop "$LOOP_ACCOUNT_ID" 'all(.reviewers[]; .reviewer.id != $loop)' <<<"$rule" >/dev/null ||
          fail "the loop's account (user id $LOOP_ACCOUNT_ID) is a required reviewer and could approve a release; an admin replaces it with a human"
        jq -e 'all(.reviewers[]; .type == "User")' <<<"$rule" >/dev/null ||
          fail "a team is a required reviewer; this job cannot read team membership, so an admin lists people by user id"
        jq -e '.can_admins_bypass == false' <<<"$env_json" >/dev/null ||
          fail "can_admins_bypass is not false; a repository admin could start this job without a reviewer's approval"

    - name: Download stub distributions
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: lium-stub-dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        attestations: true
        packages-dir: dist/
        verbose: true
        print-hash: true
