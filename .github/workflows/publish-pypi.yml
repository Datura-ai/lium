name: Publish to PyPI
run-name: PyPI ${{ github.event.workflow_run.head_branch }}

# The only path to PyPI for `lium.io`. pypi.org's trusted publisher names this file and the `pypi` environment, and
# that environment admits only `main`. A `workflow_run` always runs the default branch's copy of this file, so an
# edited copy on another branch never runs here, and the job below uploads only a release tag on a commit of main's
# first-parent history. Once main takes squash-merged, reviewed PRs only (.github/rulesets/README.md section 3), new
# commits there are reviewed PR states; older ones are not, so the `v*` tag ruleset (section 4) limits who can tag
# (RELEASING.md "Who can publish").
on:
  workflow_run:
    workflows: ["Build and Publish Python Package"]
    types: [completed]

permissions: {}

jobs:
  build:
    name: Rebuild the release tag
    # a manual run of release.yml only builds, and a failed release publishes nothing
    if: github.event.workflow_run.event == 'release' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # for a release event, head_branch is the release's tag and head_sha the commit it points at
      RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        fetch-depth: 0

    - name: Release tag must point at this commit, and the commit must be on main
      run: |
        [[ "$RELEASE_TAG" == v[0-9]* ]] || { echo "not a release tag: $RELEASE_TAG" >&2; exit 1; }
        git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" "+refs/heads/main:refs/remotes/origin/main"
        tagged="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
        [[ "$tagged" == "$RELEASE_SHA" ]] || { echo "$RELEASE_TAG points at $tagged, the release ran $RELEASE_SHA" >&2; exit 1; }
        # main's first-parent history holds the merged PR states only, not the commits a merged branch was built from
        git rev-list --first-parent origin/main | grep -xF "$RELEASE_SHA" >/dev/null ||
          { echo "$RELEASE_TAG ($RELEASE_SHA) is not on main's first-parent history; nothing published" >&2; exit 1; }

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build --sdist --wheel --outdir dist/

    - name: Check the distributions' metadata
      run: twine check --strict dist/*

    - name: Built version must equal the release tag
      run: |
        built="$(basename dist/lium_io-*.whl | cut -d- -f2)"
        [[ "$built" == "${RELEASE_TAG#v}" ]] || { echo "built version $built, release tag $RELEASE_TAG" >&2; exit 1; }

    - name: Upload Python artifact
      uses: actions/upload-artifact@v4
      with:
        name: pypi-dist
        path: dist/

  # The upload token exists only in this job: no checkout, no build, nothing from the repository runs next to it;
  # the only script is the environment check, which reads GitHub's API with gh and jq.
  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/lium.io/
    permissions:
      actions: read     # the environment read below
      id-token: write
    steps:
    # Checked before the upload: at least one required reviewer; not the loop's account (any one listed reviewer can
    # approve); users only (this job's token cannot read team membership); prevent_self_review true; can_admins_bypass
    # false (a missing field counts as true). It cannot prove pypi.org's side (.github/rulesets/README.md section 2).
    - name: Environment pypi must require a reviewer other than the loop's account
      env:
        GH_TOKEN: ${{ github.token }}
        LOOP_ACCOUNT_ID: '114649324'
      run: |
        fail() {
          echo "environment pypi: $1" >&2
          echo "nothing published (.github/rulesets/README.md section 1)" >&2
          exit 1
        }
        [[ "$LOOP_ACCOUNT_ID" =~ ^[0-9]+$ ]] || fail "LOOP_ACCOUNT_ID is not a user id; this step cannot rule out the loop's account"
        env_json="$(gh api "repos/$GITHUB_REPOSITORY/environments/pypi")" || fail "could not be read"
        rule="$(jq -c '[.protection_rules[]? | select(.type == "required_reviewers")] | first // {}' <<<"$env_json")" ||
          fail "could not be parsed"
        echo "required reviewers on environment pypi: $(jq -r '[.reviewers[]? | "\(.type) \(.reviewer.login // .reviewer.slug) (id \(.reviewer.id))"] | join(", ") | if . == "" then "none" else . end' <<<"$rule")"
        echo "can_admins_bypass on environment pypi: $(jq -r '.can_admins_bypass | tostring' <<<"$env_json")"
        jq -e '(.reviewers // []) | length > 0' <<<"$rule" >/dev/null ||
          fail "no required reviewer; an admin adds at least one human"
        jq -e --argjson loop "$LOOP_ACCOUNT_ID" 'all(.reviewers[]; .reviewer.id != $loop)' <<<"$rule" >/dev/null ||
          fail "the loop's account (user id $LOOP_ACCOUNT_ID) is a required reviewer and could approve a release; an admin replaces it with a human"
        jq -e 'all(.reviewers[]; .type == "User")' <<<"$rule" >/dev/null ||
          fail "a team is a required reviewer; this job cannot read team membership, so an admin lists people by user id"
        jq -e '.prevent_self_review == true' <<<"$rule" >/dev/null ||
          fail "prevent_self_review is not true"
        jq -e '.can_admins_bypass == false' <<<"$env_json" >/dev/null ||
          fail "can_admins_bypass is not false; a repository admin could start this job without a reviewer's approval"

    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: pypi-dist
        path: dist/

    # attestations is the action's default; written out so a future edit cannot drop it unnoticed (PEP 740:
    # PyPI shows a "Provenance" link per file, and `pypi.org/integrity/lium.io/<version>/<file>/provenance` holds it)
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        attestations: true
        verbose: true
        print-hash: true
