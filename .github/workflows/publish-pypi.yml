name: Publish to PyPI
run-name: PyPI ${{ github.event.workflow_run.head_branch }}

# The only path to PyPI for `lium.io`. pypi.org's trusted publisher names this file and the `pypi` environment, and
# that environment admits only `main`. A `workflow_run` always runs the default branch's copy of this file, so an
# edited copy on another branch never runs here, and the job below uploads only a release tag on a commit of main's
# first-parent history. Main takes squash-merged, reviewed PRs only, so only reviewed code reaches PyPI (RELEASING.md
# "Who can publish").
on:
  workflow_run:
    workflows: ["Build and Publish Python Package"]
    types: [completed]

permissions: {}

jobs:
  build:
    name: Rebuild the release tag
    # a manual run of release.yml only builds, and a failed release publishes nothing
    if: github.event.workflow_run.event == 'release' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # for a release event, head_branch is the release's tag and head_sha the commit it points at
      RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        fetch-depth: 0

    - name: Release tag must point at this commit, and the commit must be on main
      run: |
        [[ "$RELEASE_TAG" == v[0-9]* ]] || { echo "not a release tag: $RELEASE_TAG" >&2; exit 1; }
        git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" "+refs/heads/main:refs/remotes/origin/main"
        tagged="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
        [[ "$tagged" == "$RELEASE_SHA" ]] || { echo "$RELEASE_TAG points at $tagged, the release ran $RELEASE_SHA" >&2; exit 1; }
        # main's first-parent history holds the merged PR states only, not the commits a merged branch was built from
        git rev-list --first-parent origin/main | grep -xF "$RELEASE_SHA" >/dev/null ||
          { echo "$RELEASE_TAG ($RELEASE_SHA) is not on main's first-parent history; nothing published" >&2; exit 1; }

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build --sdist --wheel --outdir dist/

    - name: Check the distributions' metadata
      run: twine check --strict dist/*

    - name: Built version must equal the release tag
      run: |
        built="$(basename dist/lium_io-*.whl | cut -d- -f2)"
        [[ "$built" == "${RELEASE_TAG#v}" ]] || { echo "built version $built, release tag $RELEASE_TAG" >&2; exit 1; }

    - name: Upload Python artifact
      uses: actions/upload-artifact@v4
      with:
        name: pypi-dist
        path: dist/

  # The upload token exists only in this job: no checkout, no build, nothing from the repository runs next to it.
  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/lium.io/
    permissions:
      id-token: write
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: pypi-dist
        path: dist/

    # attestations is the action's default; written out so a future edit cannot drop it unnoticed (PEP 740:
    # PyPI shows a "Provenance" link per file, and `pypi.org/integrity/lium.io/<version>/<file>/provenance` holds it)
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        attestations: true
        verbose: true
        print-hash: true
