name: Publish Deprecated lium-cli Stub

on:
  workflow_dispatch:

jobs:
  # Holds no upload credential: build dependencies and the build backend come from PyPI and run here, never in the
  # job that can mint a PyPI token.
  build:
    name: Build lium-cli deprecation stub
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install build dependencies
      run: pip install build twine

    - name: Build stub package
      working-directory: stubs/lium-cli
      run: python -m build --sdist --wheel --outdir dist/

    - name: Check the distributions' metadata
      run: twine check --strict stubs/lium-cli/dist/*

    - name: Upload stub distributions
      uses: actions/upload-artifact@v4
      with:
        name: lium-cli-stub-dist
        path: stubs/lium-cli/dist/
        if-no-files-found: error

  # PyPI's (pending) trusted publisher names this file and the `pypi` environment, which admits only `main`
  # (RELEASING.md "Who can publish"); the `if` keeps a dispatch from any other ref to a build.
  publish:
    name: Publish lium-cli deprecation stub
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/lium-cli/
    permissions:
      id-token: write

    steps:
    - name: Download stub distributions
      uses: actions/download-artifact@v4
      with:
        name: lium-cli-stub-dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        attestations: true
        packages-dir: dist/
        verbose: true
        print-hash: true
