name: Publish to the MCP Registry
run-name: MCP Registry ${{ inputs.version || 'latest PyPI release' }}

# Lists `lium mcp` as io.github.Datura-ai/lium on the official MCP Registry (Glama and other directories read it).
# The registry checks that the PyPI release's README carries `mcp-name: io.github.Datura-ai/lium`, so this runs
# after "Publish to PyPI" and stamps server.json with the version now on PyPI. It refuses a version it already holds.
on:
  workflow_run:
    workflows: ["Publish to PyPI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "lium.io version on PyPI to list (default: the latest)"
        required: false

permissions: {}

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # `mcp-publisher login github-oidc` proves the io.github.Datura-ai namespace with this token.
      id-token: write
      contents: read
    steps:
      # Pinned by commit: this job holds id-token: write.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      - name: Stamp server.json with the PyPI version
        id: stamp
        env:
          VERSION: ${{ inputs.version }}
          PYPI_RUN_TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          # PyPI's "latest" lags an upload by minutes (v0.25.0 read 0.24.1); a release's PyPI run is titled "PyPI vX.Y.Z"
          [[ -z "$VERSION" && "$PYPI_RUN_TITLE" =~ ^PyPI\ v([0-9]+\.[0-9]+\.[0-9]+)$ ]] && VERSION="${BASH_REMATCH[1]}"
          version="${VERSION:-$(curl -fsSL https://pypi.org/pypi/lium.io/json | jq -r .info.version)}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release version: $version" >&2; exit 1; }
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 30 "https://pypi.org/pypi/lium.io/$version/json" | jq -e '.info.description | contains("mcp-name: io.github.Datura-ai/lium")' >/dev/null ||
            { echo "lium.io $version on PyPI has no mcp-name line in its README" >&2; exit 1; }
          jq --arg v "$version" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
          cat server.json
          # "Publish to PyPI" also completes, with nothing uploaded, for every non-release build
          listed="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.Datura-ai%2Flium/versions/$version")"
          if [[ "$listed" == 200 ]]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "$version is already listed"; fi

      # This job holds id-token: write, so the binary is pinned and checked before it runs.
      # To upgrade: change both values to a reviewed release and its line in registry_<version>_checksums.txt.
      - name: Install mcp-publisher
        if: steps.stamp.outputs.skip != 'true'
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Log in with GitHub OIDC
        if: steps.stamp.outputs.skip != 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        if: steps.stamp.outputs.skip != 'true'
        run: ./mcp-publisher publish
