name: Build and Publish Python Package
run-name: ${{ github.event_name == 'release' && format('Release {0}', github.event.release.tag_name) || 'Build only (manual run)' }}

on:
  # Publishing a GitHub release on tag vX.Y.Z builds that tag and ships it: the version is the
  # tag (hatch-vcs, pyproject.toml), nothing in the tree is bumped (DAH-3225). Create it with
  # --prerelease: `latest` must not point at it until the assets are uploaded below, or install.sh
  # and self-update see a release without binaries for ~3 min.
  release:
    types: [published]
  # A manual run only builds: no version input, nothing is published.
  workflow_dispatch:

env:
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  build-python:
    name: Build Python distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # the tag is the version, so this is the only place that can say which tag a release may carry: the changelog.d
    # fragments and the CHANGELOG.md sections added since the previous tag decide (### Added or no header → minor,
    # ### Removed / a BREAKING bullet → major from 1.0, Changed / Fixed / Security / Deprecated → patch; RELEASING.md).
    # Also refused: a tag not above every earlier release, and code under lium/ with no changelog entry. A line
    # `allow-version-skip: <reason>` in the release notes at publish time, with the skipped minimum committed in
    # changelog.d/.deferred_minimum, lets a hotfix patch ship on top of unreleased features (DAH-3328). Fails before
    # the wheel is built, so nothing is published: delete the release and its tag, then tag the version the message names.
    - name: Release tag must be ≥ the changelog minimum
      if: github.event_name == 'release'
      env:
        RELEASE_BODY: ${{ github.event.release.body }}
      run: |
        printf '%s\n' "$RELEASE_BODY" > "$RUNNER_TEMP/release-notes.md"
        python3 scripts/next_version.py --check "$RELEASE_TAG" --release-notes "$RUNNER_TEMP/release-notes.md"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel twine build toml

    - name: Build package
      run: python -m build --sdist --wheel --outdir dist/

    # PyPI refuses a distribution whose metadata it cannot render; find out here, before the publish job holds a reviewer
    - name: Check the distributions' metadata
      run: twine check --strict dist/*

    # a tag hatch-vcs cannot parse (v-less, extra suffix) would publish assets whose --version is not the release
    - name: Built version must equal the release tag
      if: github.event_name == 'release'
      run: |
        built="$(basename dist/lium_io-*.whl | cut -d- -f2)"
        [[ "$built" == "${RELEASE_TAG#v}" ]] || { echo "built version $built, release tag $RELEASE_TAG" >&2; exit 1; }

    - name: Upload Python artifact
      uses: actions/upload-artifact@v4
      with:
        name: python-dist
        path: dist/

  validate-binary-targets:
    name: Validate binary target matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install pytest
      run: python -m pip install --upgrade pip pytest pyyaml

    - name: Verify installer and workflow target coverage
      run: pytest test/test_release_binary_targets.py

  build-linux-binary:
    name: Build Linux binary (${{ matrix.asset_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu-latest
          platform: linux/amd64
          asset_name: lium-linux-amd64
        - runner: ubuntu-24.04-arm
          platform: linux/arm64
          asset_name: lium-linux-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: astral-sh/setup-uv@v6

    # the build image has no git (Dockerfile.build): the version hatch-vcs derives from the tags here is handed in
    - name: Bundle version (hatch-vcs, from the tags)
      id: version
      run: |
        version="$(uvx --from hatchling --with hatch-vcs hatchling version)"
        echo "version $version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    # Release builds do not import or export GHA cache: a default-branch layer is mutable and
    # must not enter a published CLI bundle. CI workflows still cache.
    - uses: docker/setup-buildx-action@v3

    # Dockerfile.build installs lockfile dependencies before COPY . . `load` puts the image
    # in the engine for the extract and the report.
    - name: Build Linux bundle in Docker
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile.build
        platforms: ${{ matrix.platform }}
        build-args: LIUM_VERSION=${{ steps.version.outputs.version }}
        tags: lium-build:${{ github.sha }}-${{ matrix.asset_name }}
        load: true

    - name: Extract the bundle from the image
      run: |
        mkdir -p dist
        rm -rf dist/lium
        docker rm -f lium-extract >/dev/null 2>&1 || true
        docker create --name lium-extract "lium-build:${GITHUB_SHA}-${{ matrix.asset_name }}" true
        docker cp lium-extract:/app/dist/lium dist/lium
        docker rm -f lium-extract
        tar -czf dist/${{ matrix.asset_name }}.tar.gz -C dist lium

    - name: Smoke test Linux bundle
      run: |
        ./dist/lium/lium --version
        ./dist/lium/lium --help >/dev/null

    # same check as ci.yml: release-assets needs this job, so a bundle with OpenSSL below 1.1.1w-0+deb11u8
    # (what 0.0.34 shipped, #223) cannot be published.
    - name: Report what the bundle ships, fail below the OpenSSL floor
      run: python3 scripts/linux_bundle_report.py --bundle dist/lium --image lium-build:${GITHUB_SHA}-${{ matrix.asset_name }} --name ${{ matrix.asset_name }}

    - name: Generate Linux checksums
      run: |
        cd dist
        sha256sum ${{ matrix.asset_name }}.tar.gz > ${{ matrix.asset_name }}.tar.gz.sha256

    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: |
          dist/${{ matrix.asset_name }}.tar.gz
          dist/${{ matrix.asset_name }}.tar.gz.sha256

  build-macos-binary:
    name: Build macOS binary (${{ matrix.asset_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: macos-14
          asset_name: lium-darwin-arm64
          expected_machine: arm64
        - runner: macos-15-intel
          asset_name: lium-darwin-amd64
          expected_machine: x86_64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      run: python -m pip install --upgrade pip uv

    - name: Build macOS binary
      run: |
        actual_machine="$(uname -m)"
        if [[ "$actual_machine" != "${{ matrix.expected_machine }}" ]]; then
          echo "Expected macOS runner architecture ${{ matrix.expected_machine }}, got $actual_machine" >&2
          exit 1
        fi
        if [[ "$actual_machine" == "x86_64" ]]; then
          # cryptography >= 49 ships no macOS Intel wheel, so uv builds it from source here. Link OpenSSL statically
          # (openssl-sys reads OPENSSL_STATIC / OPENSSL_DIR) so the bundle carries no Homebrew libssl.3.dylib: with a dynamic
          # link, PyInstaller kept python.org's older libssl.3.dylib under the same name and the binary died at import
          # (`Symbol not found: _SSL_get0_group_name`, run 34155591936). arm64 installs the wheel, which is static already.
          export OPENSSL_STATIC=1 OPENSSL_DIR="$(brew --prefix openssl@3)"
        fi
        uv sync --frozen --extra dev --extra provider
        rm -rf dist/lium
        uv run pyinstaller lium.spec --clean
        tar -czf dist/${{ matrix.asset_name }}.tar.gz -C dist lium

    - name: Smoke test macOS bundle
      run: |
        ./dist/lium/lium --version
        ./dist/lium/lium --help >/dev/null
        # cryptography must carry its OpenSSL inside _rust.abi3.so (static); a libssl/libcrypto dylib reference is the
        # 0.0.37 Intel failure coming back.
        so=dist/lium/_internal/cryptography/hazmat/bindings/_rust.abi3.so
        test -f "$so"
        deps="$(otool -L "$so")"
        if grep -E 'libssl|libcrypto' <<<"$deps"; then
          echo "cryptography links a shared OpenSSL; the bundle would ship a mismatched libssl.3.dylib" >&2
          exit 1
        fi
        # the OpenSSL baked into cryptography (the wheel's on arm64, Homebrew openssl@3's on Intel), for the record
        strings -a "$so" | grep -m1 -E '^OpenSSL [0-9]+\.[0-9]+\.[0-9]+' | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Generate macOS checksums
      run: |
        cd dist
        shasum -a 256 ${{ matrix.asset_name }}.tar.gz > ${{ matrix.asset_name }}.tar.gz.sha256

    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: |
          dist/${{ matrix.asset_name }}.tar.gz
          dist/${{ matrix.asset_name }}.tar.gz.sha256

  release-assets:
    name: Publish GitHub release assets
    if: github.event_name == 'release'
    needs:
    - build-python
    - validate-binary-targets
    - build-linux-binary
    - build-macos-binary
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download Python artifact
      uses: actions/download-artifact@v4
      with:
        name: python-dist
        path: release-assets/python-dist

    - name: Download Linux artifact
      uses: actions/download-artifact@v4
      with:
        name: lium-linux-amd64
        path: release-assets/linux-amd64

    - name: Download Linux ARM64 artifact
      uses: actions/download-artifact@v4
      with:
        name: lium-linux-arm64
        path: release-assets/linux-arm64

    - name: Download macOS ARM64 artifact
      uses: actions/download-artifact@v4
      with:
        name: lium-darwin-arm64
        path: release-assets/darwin-arm64

    - name: Download macOS AMD64 artifact
      uses: actions/download-artifact@v4
      with:
        name: lium-darwin-amd64
        path: release-assets/darwin-amd64

    - name: Assemble release assets
      run: |
        cp scripts/install.sh release-assets/install.sh
        chmod +x release-assets/install.sh
        {
          cat release-assets/linux-amd64/lium-linux-amd64.tar.gz.sha256
          cat release-assets/linux-arm64/lium-linux-arm64.tar.gz.sha256
          cat release-assets/darwin-amd64/lium-darwin-amd64.tar.gz.sha256
          cat release-assets/darwin-arm64/lium-darwin-arm64.tar.gz.sha256
        } > release-assets/checksums.txt

    - name: Upload assets to the GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload "$RELEASE_TAG" \
          release-assets/install.sh \
          release-assets/checksums.txt \
          release-assets/linux-amd64/lium-linux-amd64.tar.gz \
          release-assets/linux-amd64/lium-linux-amd64.tar.gz.sha256 \
          release-assets/linux-arm64/lium-linux-arm64.tar.gz \
          release-assets/linux-arm64/lium-linux-arm64.tar.gz.sha256 \
          release-assets/darwin-amd64/lium-darwin-amd64.tar.gz \
          release-assets/darwin-amd64/lium-darwin-amd64.tar.gz.sha256 \
          release-assets/darwin-arm64/lium-darwin-arm64.tar.gz \
          release-assets/darwin-arm64/lium-darwin-arm64.tar.gz.sha256 \
          release-assets/python-dist/* \
          --clobber

    - name: Mark the release latest now that the assets are in place
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release edit "$RELEASE_TAG" --prerelease=false --latest

  # The only path to PyPI. pypi.org's trusted publisher for `lium.io` names this repository, this file and the
  # `pypi` environment, so the upload token exists only inside this job, and only after the environment's
  # required reviewer approves the run (RELEASING.md "Who can publish"). No PyPI token is stored anywhere.
  # The `if` keeps a manual run out (a dispatch never publishes); the tag's shape is enforced by build-python
  # (next_version.py + the built-version check), which this job needs — `startsWith` alone is case-insensitive.
  approve-and-publish:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    needs: build-python
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/lium.io/
    permissions:
      actions: read     # the environment read below (GitHub: "Actions" repository permission, read)
      contents: read
      id-token: write

    steps:
    # A workflow that names an environment that does not exist makes GitHub create it with NO protection, so
    # reaching this step proves nothing by itself. Read the environment's rules back and stop unless: at least one
    # required reviewer is set; the loop's account (LOOP_ACCOUNT_ID, surcyf123) is not one of them — GitHub lets any
    # one listed reviewer approve, and prevent_self_review only blocks the account that started the run; every
    # reviewer is a user (this job's token cannot read team membership, which needs the organization "Members"
    # permission, so a team could hide the loop's account); prevent_self_review is true; can_admins_bypass is false
    # (with it true, a repository admin — the loop's account is one — can start this job with no reviewer's approval,
    # and a missing field counts as true). The guard cannot tell a human from another machine account; the admin
    # lists humans.
    # What this cannot prove: that pypi.org's old, environment-less publisher is gone (until it is, an edited copy
    # of this file on a branch, run by hand, still uploads — RELEASING.md "Who can publish", step 5).
    - name: Environment pypi must require a reviewer other than the loop's account
      env:
        GH_TOKEN: ${{ github.token }}
        LOOP_ACCOUNT_ID: '114649324'
      run: |
        fail() {
          echo "environment pypi: $1" >&2
          echo "nothing published (RELEASING.md 'Who can publish', step 1)" >&2
          exit 1
        }
        [[ "$LOOP_ACCOUNT_ID" =~ ^[0-9]+$ ]] || fail "LOOP_ACCOUNT_ID is not a user id; this step cannot rule out the loop's account"
        env_json="$(gh api "repos/$GITHUB_REPOSITORY/environments/pypi")" || fail "could not be read"
        rule="$(jq -c '[.protection_rules[]? | select(.type == "required_reviewers")] | first // {}' <<<"$env_json")" ||
          fail "could not be parsed"
        echo "required reviewers on environment pypi: $(jq -r '[.reviewers[]? | "\(.type) \(.reviewer.login // .reviewer.slug) (id \(.reviewer.id))"] | join(", ") | if . == "" then "none" else . end' <<<"$rule")"
        echo "can_admins_bypass on environment pypi: $(jq -r '.can_admins_bypass | tostring' <<<"$env_json")"
        jq -e '(.reviewers // []) | length > 0' <<<"$rule" >/dev/null ||
          fail "no required reviewer; an admin adds at least one human"
        jq -e --argjson loop "$LOOP_ACCOUNT_ID" 'all(.reviewers[]; .reviewer.id != $loop)' <<<"$rule" >/dev/null ||
          fail "the loop's account (user id $LOOP_ACCOUNT_ID) is a required reviewer and could approve a release; an admin replaces it with a human"
        jq -e 'all(.reviewers[]; .type == "User")' <<<"$rule" >/dev/null ||
          fail "a team is a required reviewer; this job cannot read team membership, so an admin lists people by user id"
        jq -e '.prevent_self_review == true' <<<"$rule" >/dev/null ||
          fail "prevent_self_review is not true"
        jq -e '.can_admins_bypass == false' <<<"$env_json" >/dev/null ||
          fail "can_admins_bypass is not false; a repository admin could start this job without a reviewer's approval"

    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: python-dist
        path: dist/

    # attestations is the action's default; written out so a future edit cannot drop it unnoticed (PEP 740:
    # PyPI shows a "Provenance" link per file, and `pypi.org/integrity/lium.io/<version>/<file>/provenance` holds it)
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        attestations: true
        verbose: true
        print-hash: true
